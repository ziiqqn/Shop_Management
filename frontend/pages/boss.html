<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>老板工作台</title>
  <link rel="stylesheet" href="../static/css/common.css">
  <link rel="stylesheet" href="../static/css/dashboard.css">
  <link rel="stylesheet" href="../static/css/table.css">
</head>

<body>
  <div class="dashboard" id="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        管理后台
        <span class="role">老板</span>
      </div>
      <ul class="sidebar-menu">
        <li :class="{ active: view === 'shops' }" @click="view = 'shops'">商铺总览</li>
        <li :class="{ active: view === 'employee' }" @click="view = 'employee'">员工注册</li>
      </ul>
      <div class="sidebar-footer">
        <button @click="logout">退出登录</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h2>{{ view === 'shops' ? '商铺总览' : '员工注册' }}</h2>
        <div class="user-info">当前用户：{{ username }}</div>
      </div>

      <div class="content">
        <!-- 商铺总览 -->
        <div v-if="view === 'shops'">
          <div class="page-header">
            <h3>所有商铺（只读）</h3>
            <button class="btn" @click="loadShops">刷新</button>
          </div>
          <table class="data-table" v-if="shops.length">
            <thead>
              <tr>
                <th>ID</th>
                <th>铺位号</th>
                <th>楼层</th>
                <th>建筑面积</th>
                <th>使用面积</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="s in shops" :key="s.id">
                <td>{{ s.id }}</td>
                <td>{{ s.shopNumber }}</td>
                <td>{{ s.floor }}</td>
                <td>{{ s.buildingArea }}</td>
                <td>{{ s.useArea }}</td>
                <td>
                  <span class="tag" :class="s.isRented ? 'tag-danger' : 'tag-success'">
                    {{ s.isRented ? '已出租' : '未出租' }}
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
          <div v-else class="empty">暂无数据</div>
        </div>

        <!-- 员工注册 -->
        <div v-if="view === 'employee'">
          <div class="card" style="max-width:560px">
            <div class="card-header">
              <h4>注册新员工</h4>
            </div>
            <div class="form-group">
              <label>工号 *</label>
              <input class="form-control" v-model="empForm.jobNumber" placeholder="如 EMP005">
            </div>
            <div class="form-group">
              <label>姓名 *</label>
              <input class="form-control" v-model="empForm.name">
            </div>
            <div class="form-group">
              <label>密码 *</label>
              <input class="form-control" type="password" v-model="empForm.password">
            </div>
            <div class="form-group">
              <label>部门 *</label>
              <select class="form-control" v-model="empForm.department">
                <option value="">请选择</option>
                <option value="INVESTMENT">招商</option>
                <option value="FINANCE">财务</option>
                <option value="OPERATION">营运</option>
                <option value="CASHIER">收银</option>
              </select>
            </div>
            <div class="form-group">
              <label>职级 *</label>
              <select class="form-control" v-model="empForm.rank">
                <option value="员工">员工</option>
                <option value="经理">经理</option>
              </select>
            </div>
            <button class="btn btn-primary" style="width:100%" :disabled="loading" @click="submitEmployee">
              {{ loading ? '提交中...' : '注 册' }}
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="../static/js/api.js"></script>
  <script src="../static/js/boss.js"></script>
</body>

</html>
