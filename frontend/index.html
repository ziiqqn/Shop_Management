<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商铺信息管理系统 · 登录</title>
  <link rel="stylesheet" href="static/css/common.css">
  <link rel="stylesheet" href="static/css/login.css">
</head>

<body>
  <div class="login-page" id="app">
    <div class="login-card">
      <h1>商铺信息管理系统</h1>
      <p class="subtitle">Shop Management System</p>

      <div class="tabs">
        <div class="tab" :class="{ active: tab === 'employee' }" @click="switchTab('employee')">员工登录</div>
        <div class="tab" :class="{ active: tab === 'merchant' }" @click="switchTab('merchant')">商户登录</div>
        <div class="tab" :class="{ active: tab === 'boss' }" @click="switchTab('boss')">老板登录</div>
      </div>

      <div class="tab-content">
        <div class="form-group">
          <label>{{ usernameLabel }}</label>
          <input class="form-control" v-model="form.username" :placeholder="usernamePlaceholder">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-control" type="password" v-model="form.password" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary" :disabled="loading" @click="handleLogin">
          {{ loading ? '登录中...' : '登 录' }}
        </button>

        <div class="register-link" v-if="tab === 'merchant'">
          没有账号？<a href="pages/register.html">商户注册</a>
        </div>
      </div>
    </div>
  </div>

  <script src="static/lib/vue.global.prod.js"></script>
  <script src="static/lib/axios.min.js"></script>
  <script src="static/js/api.js"></script>
  <script src="static/js/login.js"></script>
</body>

</html>
