# ============================================
# Render 部署配置
# 文档：https://render.com/docs/blueprint-spec
# 使用方法：把此文件放在项目根目录（render.yaml）
# ============================================

services:
  # ============ Web 服务（后端 + 前端） ============
  - type: web
    name: shop-management
    env: docker
    region: singapore          # 亚太节点，国内访问较快；可选 oregon / frankfurt
    plan: free                 # 免费计划
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .           # 上下文为项目根目录
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: shop-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: shop-management-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: shop-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: shop-management-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: shop-management-db
          property: database
      - key: JWT_SECRET
        generateValue: true    # Render 自动生成随机密钥
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"

# ============ 数据库（MySQL） ============
databases:
  - name: shop-management-db
    databaseName: shop_db
    plan: free                 # 免费计划（Render 免费 MySQL 有时间限制，可选升级）
    region: singapore